name: Reviewed Terraform Plan And Manual Apply
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      plan_run_id:
        description: Successful infrastructure or release run ID, reviewed before apply
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: application-gcp-state
  cancel-in-progress: false
jobs:
  deployment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ vars.GCP_GITHUB_ENVIRONMENT || 'dev' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      BACKEND_HCL: ${{ vars.GCP_BACKEND_HCL }}
      TFVARS: ${{ vars.GCP_TFVARS }}
    steps:
      - name: Require restricted plan storage
        run: test "$PRIVATE_REPOSITORY" = true
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.11.4'
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a
      - name: Configure the single application root
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$BACKEND_HCL" && test -n "$TFVARS"
          printf '%s\n' "$BACKEND_HCL" > infra/backend.hcl
          printf '%s\n' "$TFVARS" > infra/terraform.tfvars
          terraform -chdir=infra init -input=false -lockfile=readonly -backend-config=backend.hcl
          terraform -chdir=infra validate
      - name: Plan infrastructure changes without changing the deployed image
        if: inputs.operation == 'plan'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          current=$(terraform -chdir=infra output -json deployment)
          jq -e '.enable_runtime == true' <<< "$current" >/dev/null
          enabled=$(terraform -chdir=infra console <<< 'var.enable_runtime')
          test "$enabled" = true
          image=$(terraform -chdir=infra console <<< 'var.image' | jq -er .)
          test "$image" = "$(jq -r '.image' <<< "$current")"
          terraform -chdir=infra plan -input=false -lock-timeout=5m -out=reviewed.tfplan > infra/plan.log 2>&1
          terraform -chdir=infra show -no-color reviewed.tfplan > infra/plan.txt
          cd infra
          sha256sum reviewed.tfplan backend.hcl > checksums.txt
      - name: Store the exact sensitive plan for one day
        if: inputs.operation == 'plan'
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-plan
          path: |
            infra/reviewed.tfplan
            infra/plan.txt
            infra/checksums.txt
          if-no-files-found: error
          retention-days: 1
      - name: Identify the plan for private review
        if: inputs.operation == 'plan'
        run: printf 'Review the [sensitive saved plan](%s). Commit `%s`, run `%s`. Dispatch apply separately with this run ID after review.\n' "$ARTIFACT_URL" "$GITHUB_SHA" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
      - name: Verify the selected plan run belongs to this commit and repository
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]
          test "$PLAN_RUN_ID" != "$GITHUB_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID" | jq -e \
            --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.conclusion == "success" and .event == "workflow_dispatch" and .head_branch == "main" and .head_sha == $sha and .repository.full_name == $repo and (.path == ".github/workflows/infrastructure.yml" or .path == ".github/workflows/release.yml")' >/dev/null
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      - name: Retrieve only the verified run's saved plan
        if: inputs.operation == 'apply'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: deployment-plan
          path: infra
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
      - name: Apply the exact saved plan, never replan
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd infra
          sha256sum -c checksums.txt
          terraform apply -input=false -lock-timeout=5m reviewed.tfplan > apply.log 2>&1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.operation == 'apply'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: inputs.operation == 'apply'
      - name: Wait for the MIG and HTTP endpoint, then smoke test
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          deployment=$(terraform -chdir=infra output -json deployment)
          gcloud compute instance-groups managed wait-until "$(jq -r '.mig' <<< "$deployment")" --stable \
            --project="$(jq -r '.project_id' <<< "$deployment")" --region="$(jq -r '.region' <<< "$deployment")" --timeout=900
          url=$(jq -er '.api_url' <<< "$deployment")
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 10 --max-time 10 "$url" >/dev/null
          SMOKE_ALLOW_HTTP=true node tests/smoke/api.js "$url"
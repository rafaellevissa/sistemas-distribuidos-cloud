name: Dev Runtime Destroy Plan Only
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev]
        default: dev
        required: true
      confirm:
        description: Enter gcp/dev/runtime
        type: string
        required: true
      image:
        description: Current full Artifact Registry image digest
        type: string
        required: true
      secret_version:
        description: Current positive runtime secret version (not payload)
        type: string
        required: true
      allow_data_loss:
        description: Explicitly acknowledge destruction risk
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: platform-gcp-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main' && inputs.environment == 'dev' && inputs.allow_data_loss && inputs.confirm == 'gcp/dev/runtime'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.11.4'
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - run: node --require ./scripts/isolate-credentials.js platform/cli/src/index.js destroy --target gcp --environment dev --stack runtime --image "$IMAGE" --secret-version "$SECRET_VERSION" --confirm "$CONFIRM" --allow-data-loss
        env:
          IMAGE: ${{ inputs.image }}
          SECRET_VERSION: ${{ inputs.secret_version }}
          CONFIRM: ${{ inputs.confirm }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dev-runtime-destroy-plan
          path: |
            .platform/gcp/dev/runtime/reviewed.tfplan
            .platform/gcp/dev/runtime/plan.json
            .platform/gcp/dev/runtime/plan.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-password
          MYSQL_DATABASE: aula_pratica_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run test:integration
        env:
          INTEGRATION_DB_HOST: 127.0.0.1
          INTEGRATION_DB_USER: root
          INTEGRATION_DB_PASSWORD: ci-disposable-password
      - run: docker build --file apps/api/Dockerfile --tag distributed-cloud-api:ci .
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [infra/bootstrap/gcp, infra]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.11.4'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - run: terraform init -backend=false -input=false -lockfile=readonly
        working-directory: ${{ matrix.root }}
      - run: terraform validate
        working-directory: ${{ matrix.root }}
      - run: terraform test
        working-directory: ${{ matrix.root }}